<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Retro Racer">
  <title>Retro Racer 8-Bit</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
      <div id="hud" class="hidden">
        <div id="speed-display">Speed: 0 km/h</div>
        <div id="score-display">Score: 0</div>
        <div id="level-display">Level: 1</div>
        <div id="distance-display">Distance: 0m</div>
      </div>
      <div id="menu">
        <h1 id="title">RETRO RACER</h1>
        <p id="subtitle">8-BIT EDITION</p>
        <div id="menu-buttons">
          <button id="btn-start" class="menu-btn">START GAME</button>
          <button id="btn-continue" class="menu-btn hidden">CONTINUE</button>
          <button id="btn-levels" class="menu-btn">LEVEL SELECT</button>
        </div>
        <div id="highscore">High Score: 0</div>
      </div>
      <div id="game-over" class="hidden">
        <h2 id="game-over-title">STAGE COMPLETE!</h2>
        <div id="final-score">Score: 0</div>
        <div id="final-distance">Distance: 0m</div>
        <div id="new-highscore" class="hidden">NEW HIGH SCORE!</div>
        <button id="btn-restart" class="menu-btn">PLAY AGAIN</button>
        <button id="btn-menu" class="menu-btn">MAIN MENU</button>
      </div>
      <div id="level-select" class="hidden">
        <h2>SELECT LEVEL</h2>
        <div id="level-grid"></div>
        <button id="btn-back" class="menu-btn">BACK</button>
      </div>
      <div id="pause-screen" class="hidden">
        <h2>PAUSED</h2>
        <button id="btn-resume" class="menu-btn">RESUME</button>
        <button id="btn-quit" class="menu-btn">QUIT</button>
      </div>
    </div>
  </div>
   <script src="js/touch.js?v=20"></script>
   <script src="js/sound.js?v=20"></script>
   <script src="js/save.js?v=20"></script>
   <script src="js/levels.js?v=20"></script>
   <script src="js/road.js?v=20"></script>
   <script src="js/obstacles.js?v=20"></script>
   <script src="js/car.js?v=20"></script>
   <script src="js/main.js?v=20"></script>
</body>
</html>
